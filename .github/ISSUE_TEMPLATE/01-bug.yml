name: Report an ImageCrystal bug
description: Report a reproducible problem in this Windows fork.
body:
  - type: markdown
    attributes:
      value: Please search existing issues first. Use safe sample files and remove personal paths from logs.
  - type: input
    id: version
    attributes:
      label: ImageCrystal version
      description: Full version from About, for example 9.7.0. Do not use "latest".
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Relevant settings and image details
      description: Include dimensions, actual format, preloading count and ICC settings where relevant.
  - type: textarea
    id: sample
    attributes:
      label: Safe sample or error details
      description: Share only files you have permission to publish. Logs can contain full paths.
