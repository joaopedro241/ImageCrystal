name: Suggest an ImageCrystal improvement
description: Suggest a focused improvement for the Windows v9 continuation.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Explain the user benefit and any resource or compatibility tradeoffs.
    validations:
      required: true
